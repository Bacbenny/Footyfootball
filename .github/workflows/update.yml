name: Validate FPT scraper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper.py"
      - "test_scraper.py"
      - ".github/workflows/update.yml"
  pull_request:
    branches: [main]
    paths:
      - "scraper.py"
      - "test_scraper.py"
      - ".github/workflows/update.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "requests[socks]"

      - name: Run tests
        run: python -m unittest -v test_scraper.py
      - name: Compile Python files
        run: python -m compileall -q scraper.py test_scraper.py
