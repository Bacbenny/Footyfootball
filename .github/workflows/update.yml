name: Validate scraper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "requests[socks]" curl_cffi

      - name: Compile scraper
        run: python -m py_compile scraper.py

      - name: Run offline tests
        run: python -m unittest -v test_scraper.py