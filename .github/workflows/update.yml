name: Update FPT event playlist

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Compile scraper
        run: python -m py_compile scraper.py

      - name: Run offline tests
        run: python -m unittest -v test_scraper.py

      - name: Generate playlist
        env:
          USER_TOKEN: ${{ secrets.USE_TOKEN || secrets.USER_TOKEN }}
          FPT_USE_USER_TOKEN: 'true'
        run: python scraper.py

      - name: Commit updated playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo 'No playlist changes.'
            exit 0
          fi
          git commit -m 'chore: update FPT event playlist'
          git push origin main
